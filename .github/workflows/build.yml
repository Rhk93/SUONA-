name: Crea app SUONA

on:
  push:
    branches: [main]
    paths: ['SUONA-app.zip', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai lo zip
        run: unzip -o SUONA-app.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Spartito anche senza internet
        working-directory: app
        run: |
          if curl -fsSL https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js -o www/vexflow.js; then
            sed -i 's#https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js#vexflow.js#' www/index.html
          fi
      - name: Prepara progetto Android
        working-directory: app
        run: |
          rm -f package.json
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
          npx cap add android
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#7c3aed' --splashBackgroundColor '#05051a' || true
          npx cap sync android
      - name: Compila e firma APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks ../suona.jks --ks-key-alias suona --ks-pass pass:suona123 --key-pass pass:suona123 --out ../../SUONA-Android.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SUONA-Android.apk

  computer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Estrai lo zip
        shell: pwsh
        run: Expand-Archive -Path SUONA-app.zip -DestinationPath app -Force
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spartito anche senza internet
        shell: bash
        working-directory: app
        run: |
          if curl -fsSL https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js -o www/vexflow.js; then
            sed -i.bak 's#https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js#vexflow.js#' www/index.html && rm -f www/index.html.bak
          fi
      - name: Crea app
        shell: bash
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg

  release:
    needs: [android, computer]
    if: always() && (needs.android.result == 'success' || needs.computer.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: SUONA! versione 1.${{ github.run_number }}
          body: App SUONA! per Android (APK), Windows (installazione o portatile) e Mac (DMG). Copyright © Ignazio Paolicelli
          files: out/*
